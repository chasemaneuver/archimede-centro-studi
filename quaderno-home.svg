<svg viewBox="0 0 540 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quaderno Archimede: ascolto, metodo e autonomia">
            <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#004a59" stroke-opacity=".095" stroke-width=".7"/></pattern><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#004a59" flood-opacity=".11"/></filter></defs>
            <path class="assembly-piece assembly-backdrop water-shape" d="M43 211C22 107 111 33 227 32c146-2 253 42 276 157 22 112-36 234-150 275-108 39-218-18-272-98-35-49-28-104-38-155Z" fill="#b6e3d4"/>
            <circle class="assembly-piece assembly-sun" cx="449" cy="81" r="42" fill="#fff5cb"/>
            <g class="assembly-piece assembly-notebook" transform="rotate(-7 272 260)" filter="url(#shadow)">
              <rect x="87" y="70" width="348" height="395" rx="9" fill="#fffdf3"/>
              <rect x="87" y="70" width="348" height="395" rx="9" fill="url(#grid)"/>
              <path d="M124 70v395" stroke="#f07018" stroke-opacity=".28"/>
              <g stroke="#739487" stroke-width="2"><path d="M100 90v-17M127 90v-17M154 90v-17M181 90v-17M208 90v-17M235 90v-17M262 90v-17M289 90v-17M316 90v-17M343 90v-17M370 90v-17M397 90v-17"/></g>
              <text x="149" y="124" font-family="Arial,sans-serif" font-size="10" fill="#52696b" letter-spacing="2">IL TUO PROSSIMO PASSO</text>
              <text x="149" y="167" font-family="Georgia,serif" font-style="italic" font-size="31" fill="#004a59">Si parte da te.</text>
              <path d="M150 182q109 7 212-2" fill="none" stroke="#f07018" stroke-width="3" stroke-linecap="round"/>
              <path d="M164 240c18 28 59 11 84 20 68 22-18 51 1 84 11 19 75-5 98 9" fill="none" stroke="#33a7b5" stroke-width="2" stroke-dasharray="5 6"/>
              <circle cx="163" cy="233" r="17" fill="#fff5cb" stroke="#004a59" stroke-width="1.2"/><text x="158" y="238" font-family="Arial,sans-serif" font-size="14" fill="#004a59">1</text>
              <text x="196" y="232" font-family="Arial,sans-serif" font-size="17" fill="#004a59">Ti ascoltiamo</text><text x="196" y="250" font-family="Arial,sans-serif" font-size="10" fill="#52696b">Obiettivi, dubbi, possibilità.</text>
              <circle cx="175" cy="298" r="17" fill="#b6e3d4" stroke="#004a59" stroke-width="1.2"/><text x="170" y="303" font-family="Arial,sans-serif" font-size="14" fill="#004a59">2</text>
              <text x="208" y="297" font-family="Arial,sans-serif" font-size="17" fill="#004a59">Troviamo il metodo</text><text x="208" y="315" font-family="Arial,sans-serif" font-size="10" fill="#52696b">Il tuo, non quello di tutti.</text>
              <circle cx="184" cy="363" r="17" fill="#004a59"/><path d="m176 363 5 5 10-11" fill="none" stroke="#fff5cb" stroke-width="2"/>
              <text x="217" y="357" font-family="Arial,sans-serif" font-size="16" fill="#004a59"><tspan x="217">Cresci,</tspan><tspan x="217" dy="19">passo dopo passo</tspan></text><text x="217" y="393" font-family="Arial,sans-serif" font-size="10" fill="#52696b">Più fiducia. Più autonomia.</text>
              <text x="149" y="432" font-family="Georgia,serif" font-size="15" font-style="italic" fill="#52696b"><tspan x="149">Il potenziale c’è.</tspan><tspan x="149" dy="19">Mettiamolo in moto.</tspan></text>
            </g>
            <g class="assembly-piece assembly-pencil" transform="rotate(17 445 309)"><path d="M436 171h18v222h-18z" fill="#f07018"/><path d="M436 171h6v222h-6z" fill="#ff9b4e"/><path d="m436 393 9 28 9-28Z" fill="#dbc5a0"/><path d="m442 411 3 10 3-10Z" fill="#004a59"/><rect x="436" y="160" width="18" height="20" rx="3" fill="#004a59"/><path d="M436 180h18" stroke="#fff5cb" stroke-width="3"/></g>
            <g class="assembly-piece assembly-orbit" transform="translate(17 79) scale(.78)" fill="none" stroke="#004a59" stroke-width="1.5"><circle cx="70" cy="70" r="47"/><ellipse cx="70" cy="70" rx="67" ry="24" transform="rotate(-25 70 70)"/><ellipse cx="70" cy="70" rx="29" ry="58" transform="rotate(-25 70 70)"/><circle class="orbit-satellite" cx="124" cy="46" r="5" fill="#f07018" stroke="none"/></g>
            <g class="assembly-piece assembly-spark-right"><path class="notebook-star star-counterclockwise" d="m476 206 4-12 4 12 12 4-12 4-4 12-4-12-12-4Z" fill="#004a59"/></g><g class="assembly-piece assembly-spark-left"><path class="notebook-star star-clockwise" d="m70 413 3-9 3 9 9 3-9 3-3 9-3-9-9-3Z" fill="#f07018"/></g>
          </svg>